services:
  - type: web
    name: the-mind-multi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: RECONNECT_GRACE_MS
        value: "60000"
      - key: CORS_ORIGIN
        value: "*"

  - type: web
    name: the-mind-web
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: mobile/dist
